# Plan morning-digest § 3/§ 4 (ADR 0003). Builds a static copy of /digest/2026-10-28 and deploys it
# to GitHub Pages from a build artifact, so no preview is ever committed. The banner marker comes from
# the repo variable LANE_MARKER; clear the variable and run again to upload the same page without it.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview
        default: '2026-10-28'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: Save the page with a command
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
          PORT: '8787'
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf "localhost:8787/digest/${{ inputs.night }}" -o _site/index.html
          grep -o '<span class="marker">[^<]*</span>' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
